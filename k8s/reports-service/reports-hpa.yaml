# HorizontalPodAutoscaler for reports-service
# Scales the public write path (2–6 replicas) based on CPU utilisation.
# Outbreak events (sudden ZOMBIE_SIGHTING spikes) will trigger scale-out.
#
# Requires metrics-server installed in the cluster:
#   minikube:  minikube addons enable metrics-server
#   EKS:       kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reports-service-hpa
  namespace: rpd311
  labels:
    app: reports-service
    app.kubernetes.io/part-of: rpd311
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reports-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65    # scale out when avg CPU > 65%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # react quickly to traffic spikes
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60             # add at most 2 pods per minute
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 minutes before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120            # remove at most 1 pod per 2 minutes
