apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports-service
  namespace: rpd311
  labels:
    app: reports-service
    app.kubernetes.io/name: reports-service
    app.kubernetes.io/part-of: rpd311
    app.kubernetes.io/version: "1.0.0"
    team: civic-platform
    environment: demo
    # Postman API Catalog discovery labels
    postman.com/service-name: reports-service
    postman.com/service-version: "1.0.0"
  annotations:
    # A slash-containing value is invalid as a label — it must be an annotation.
    postman.com/openapi-path: "/openapi.yaml"
spec:
  replicas: 2   # baseline; HPA scales from 2–6
  selector:
    matchLabels:
      app: reports-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime deploy
  template:
    metadata:
      labels:
        app: reports-service
        app.kubernetes.io/name: reports-service
        app.kubernetes.io/part-of: rpd311
        app.kubernetes.io/version: "1.0.0"
        postman.com/service-name: reports-service
      annotations:
        # Causes pods to restart when the shared ConfigMap changes
        checksum/config: "placeholder-updated-by-ci"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: reports-service
          # Built locally and loaded into minikube: `minikube image load rpd311/reports-service:1.0.0`
          image: rpd311/reports-service:1.0.0
          imagePullPolicy: IfNotPresent   # image is loaded into the node, not pulled from a registry
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: SERVICE_NAME
              value: "reports-service"
          envFrom:
            - configMapRef:
                name: rpd311-common
            - secretRef:
                name: rpd311-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
      securityContext:
        fsGroup: 1000
