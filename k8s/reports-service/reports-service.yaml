apiVersion: v1
kind: Service
metadata:
  name: reports-service
  namespace: rpd311
  labels:
    app: reports-service
    app.kubernetes.io/name: reports-service
    app.kubernetes.io/part-of: rpd311
spec:
  type: ClusterIP    # nginx ingress handles external exposure — see ingress/ingress-local.yaml
  selector:
    app: reports-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
