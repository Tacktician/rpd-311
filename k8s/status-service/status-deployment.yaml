apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-service
  namespace: rpd311
  labels:
    app: status-service
    app.kubernetes.io/name: status-service
    app.kubernetes.io/part-of: rpd311
    app.kubernetes.io/version: "1.0.0"
    team: civic-platform
    environment: demo
    # Postman API Catalog discovery labels
    postman.com/service-name: status-service
    postman.com/service-version: "1.0.0"
  annotations:
    # A slash-containing value is invalid as a label — it must be an annotation.
    postman.com/openapi-path: "/openapi.yaml"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: status-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: status-service
        app.kubernetes.io/name: status-service
        app.kubernetes.io/part-of: rpd311
        postman.com/service-name: status-service
      annotations:
        checksum/config: "placeholder-updated-by-ci"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: status-service
          # TODO: replace with your ECR image URI before deploying to EKS
          image: rpd311/status-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            - name: PORT
              value: "3003"
            - name: SERVICE_NAME
              value: "status-service"
            # Cache TTLs — tunable per environment
            - name: CACHE_TTL_STATUS_SECONDS
              value: "30"
            - name: CACHE_TTL_FEED_SECONDS
              value: "60"
            - name: CACHE_TTL_STATS_SECONDS
              value: "300"
            - name: CACHE_TTL_HEATMAP_SECONDS
              value: "600"
          envFrom:
            - configMapRef:
                name: rpd311-common
            - secretRef:
                name: rpd311-secrets
          resources:
            requests:
              cpu: 75m       # lighter than reports-service — mostly cache reads
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
      securityContext:
        fsGroup: 1000
