apiVersion: v1
kind: Service
metadata:
  name: status-service
  namespace: rpd311
  labels:
    app: status-service
    app.kubernetes.io/name: status-service
    app.kubernetes.io/part-of: rpd311
spec:
  type: ClusterIP   # Ingress controller handles external exposure — see ingress.yaml
  selector:
    app: status-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
