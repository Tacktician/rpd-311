# external-secret-eso.yaml — EKS ONLY
# Requires External Secrets Operator installed in the cluster.
# Uses the stable external-secrets.io/v1 API — needs ESO >= 0.10.0 (which promoted
# SecretStore/ExternalSecret from v1beta1 to v1). For older ESO, use v1beta1.
# Install ESO: https://external-secrets.io/latest/introduction/getting-started/
#
# Assumes secrets are stored in AWS Secrets Manager under the path:
#   rpd311/demo/<secret-name>
#
# Required secrets to create in AWS Secrets Manager before applying:
#   rpd311/demo/postgres     — { host, port, user, password, db_reports, db_triage, db_status }
#   rpd311/demo/redis        — { url }
#   rpd311/demo/s3           — { bucket_name, region }
#   rpd311/demo/service-auth — { service_token }
#   rpd311/demo/postman      — { api_key }
#
# IAM: the EKS node role (or IRSA role) must have secretsmanager:GetSecretValue
# permission on arn:aws:secretsmanager:<region>:<account>:secret:rpd311/demo/*
#
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rpd311-aws-secrets
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1   # TODO: update to match your EKS cluster region
      auth:
        jwt:
          serviceAccountRef:
            name: rpd311-eso-sa  # IRSA service account — see irsa-serviceaccount.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rpd311-eso-sa
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
  annotations:
    # TODO: replace with your IRSA role ARN
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/rpd311-eso-role"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rpd311-secrets
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: rpd311-aws-secrets
    kind: SecretStore
  target:
    name: rpd311-secrets      # produces the same Secret name as secret-local.yaml
    creationPolicy: Owner     # ESO owns the Secret; deleting ExternalSecret deletes the Secret
  data:
    # Postgres
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: rpd311/demo/postgres
        property: host
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: rpd311/demo/postgres
        property: port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: rpd311/demo/postgres
        property: user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: rpd311/demo/postgres
        property: password
    - secretKey: POSTGRES_DB_REPORTS
      remoteRef:
        key: rpd311/demo/postgres
        property: db_reports
    - secretKey: POSTGRES_DB_TRIAGE
      remoteRef:
        key: rpd311/demo/postgres
        property: db_triage
    - secretKey: POSTGRES_DB_STATUS
      remoteRef:
        key: rpd311/demo/postgres
        property: db_status
    # Redis
    - secretKey: REDIS_URL
      remoteRef:
        key: rpd311/demo/redis
        property: url
    # S3
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: rpd311/demo/s3
        property: bucket_name
    - secretKey: S3_REGION
      remoteRef:
        key: rpd311/demo/s3
        property: region
    # Service-to-service auth
    - secretKey: SERVICE_TOKEN
      remoteRef:
        key: rpd311/demo/service-auth
        property: service_token
    # Postman
    - secretKey: POSTMAN_API_KEY
      remoteRef:
        key: rpd311/demo/postman
        property: api_key
