apiVersion: v1
kind: ConfigMap
metadata:
  name: rpd311-common
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
data:
  # Service discovery URLs — uses Kubernetes cluster DNS
  # These are stable within the cluster regardless of environment
  REPORTS_SERVICE_URL: "http://reports-service.rpd311.svc.cluster.local/v1"
  TRIAGE_SERVICE_URL:  "http://triage-service.rpd311.svc.cluster.local/v1"
  STATUS_SERVICE_URL:  "http://status-service.rpd311.svc.cluster.local/v1"

  # W3C trace header propagation — must be enabled on all services
  # for the Postman API Catalog Service Graph to populate correctly.
  TRACEPARENT_PROPAGATION_ENABLED: "true"

  # Node environment
  NODE_ENV: "production"
  LOG_LEVEL: "info"
