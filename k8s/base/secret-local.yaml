# secret-local.yaml — LOCAL DEVELOPMENT ONLY
# Used with minikube / kind. Do NOT apply to EKS.
# For EKS use the External Secrets Operator manifests in each service's k8s/ directory.
#
# Values below are base64-encoded placeholders.
# Replace with your own before applying:
#   echo -n "your-value" | base64
#
# Apply with:
#   kubectl apply -f base/secret-local.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: rpd311-secrets
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
    environment: local
type: Opaque
data:
  # Postgres — shared RDS instance, three databases
  # Local: single postgres container (see docker-compose.yml)
  POSTGRES_HOST:     cG9zdGdyZXM=         # postgres
  POSTGRES_PORT:     NTQzMg==             # 5432
  POSTGRES_USER:     cnBkMzEx             # rpd311
  POSTGRES_PASSWORD: Y2hhbmdlbWU=         # changeme
  POSTGRES_DB_REPORTS: cmVwb3J0cw==       # reports
  POSTGRES_DB_TRIAGE:  dHJpYWdl           # triage
  POSTGRES_DB_STATUS:  c3RhdHVz           # status

  # Redis — status-service cache layer
  # Local: redis container (see docker-compose.yml)
  REDIS_URL: cmVkaXM6Ly9yZWRpczo2Mzc5   # redis://redis:6379

  # S3 — reports-service attachment storage
  # Local: LocalStack (see docker-compose.yml)
  S3_BUCKET_NAME:   cnBkMzExLWF0dGFjaG1lbnRz  # rpd311-attachments
  S3_REGION:        dXMtZWFzdC0x               # us-east-1
  AWS_ACCESS_KEY_ID:     dGVzdA==              # test (LocalStack)
  AWS_SECRET_ACCESS_KEY: dGVzdA==              # test (LocalStack)
  S3_ENDPOINT_URL:  aHR0cDovL2xvY2Fsc3RhY2s6NDU2Ng==  # http://localstack:4566

  # Service-to-service shared secret
  # Used in X-Service-Token header for triage-service and status-service internal endpoints
  SERVICE_TOKEN: Y2hhbmdlbWUtc2VydmljZS10b2tlbg==  # changeme-service-token

  # Postman API key — used by Insights Agent (Lessons 6–7)
  POSTMAN_API_KEY: eW91ci1wb3N0bWFuLWFwaS1rZXktaGVyZQ==  # your-postman-api-key-here
