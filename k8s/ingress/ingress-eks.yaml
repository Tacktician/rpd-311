# ingress-eks.yaml — EKS (AWS Load Balancer Controller)
# Provisions an internet-facing ALB with path-based routing.
#
# Prerequisites:
#   - AWS Load Balancer Controller installed in the cluster
#     https://docs.aws.amazon.com/eks/latest/userguide/aws-load-balancer-controller.html
#   - ACM certificate ARN for your domain (rpd311.raccoon.gov or demo subdomain)
#   - Route 53 or external DNS pointed at the ALB DNS name after creation
#
# TODO before applying:
#   1. Replace CERTIFICATE_ARN with your ACM certificate ARN
#   2. Replace HOSTED_ZONE_ID and DNS name if using external-dns
#   3. Replace VPC_ID with your EKS VPC ID (required for ALB subnet discovery)
#
# Routes (same as local, different host):
#   https://api.rpd311.raccoon.gov/v1/reports*  → reports-service
#   https://api.rpd311.raccoon.gov/v1/status*   → status-service
#   https://api.rpd311.raccoon.gov/v1/feed*     → status-service
#   https://api.rpd311.raccoon.gov/v1/stats*    → status-service
#
# triage-service has NO ingress rule — ClusterIP only.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpd311-ingress-eks
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
    environment: eks
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # TODO: replace with your ACM certificate ARN
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERTIFICATE_ID"
    # Health check paths — ALB uses these to determine target group health
    alb.ingress.kubernetes.io/healthcheck-path: /v1/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # Pass traceparent header through — required for Postman Service Graph
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      routing.http.x_amzn_tls_version_and_cipher_suite.enabled=true
    # Rate limiting via WAF (optional — attach a WAF ACL ARN if available)
    # alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:..."
    # Group ingress rules under a single ALB (cost optimisation)
    alb.ingress.kubernetes.io/group.name: rpd311
    alb.ingress.kubernetes.io/group.order: "10"
spec:
  rules:
    - host: api.rpd311.raccoon.gov    # TODO: update to your demo domain
      http:
        paths:
          # reports-service
          - path: /v1/reports
            pathType: Prefix
            backend:
              service:
                name: reports-service
                port:
                  name: http
          # status-service — all public read paths
          - path: /v1/status
            pathType: Prefix
            backend:
              service:
                name: status-service
                port:
                  name: http
          - path: /v1/feed
            pathType: Prefix
            backend:
              service:
                name: status-service
                port:
                  name: http
          - path: /v1/stats
            pathType: Prefix
            backend:
              service:
                name: status-service
                port:
                  name: http
