# ingress-local.yaml — LOCAL DEVELOPMENT (minikube / kind)
# Uses nginx ingress controller.
#
# Enable nginx ingress on minikube:
#   minikube addons enable ingress
#
# Enable nginx ingress on kind:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
#
# Access locally via:
#   minikube: $(minikube ip)  — add to /etc/hosts as rpd311.local
#   kind:     localhost       — add to /etc/hosts as rpd311.local
#
# /etc/hosts entry:
#   127.0.0.1   rpd311.local
#
# Routes:
#   https://rpd311.local/v1/reports*   → reports-service
#   https://rpd311.local/v1/status*    → status-service
#   https://rpd311.local/v1/feed*      → status-service
#   https://rpd311.local/v1/stats*     → status-service
#
# triage-service has NO ingress rule — ClusterIP only, internal access only.
#
# NO configuration-snippet annotation. Modern ingress-nginx — including the version the
# minikube `ingress` addon installs — rejects snippet annotations outright:
#
#   admission webhook "validate.nginx.ingress.kubernetes.io" denied the request:
#   nginx.ingress.kubernetes.io/configuration-snippet annotation cannot be used.
#   Snippet directives are disabled by the Ingress administrator
#
# Re-enabling them needs BOTH `allow-snippet-annotations: "true"` and
# `annotations-risk-level: "Critical"` in the controller ConfigMap, which is a lot of
# ceremony for nothing: nginx already forwards traceparent/tracestate to upstreams by
# default, so the snippet never did any work. Matches k8s/prod/ingress-prod.yaml.
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rpd311-ingress-local
  namespace: rpd311
  labels:
    app.kubernetes.io/part-of: rpd311
    environment: local
  annotations:
    # Preserve the /v1 prefix — the services mount their routes under /v1 (matching
    # the OpenAPI `servers` base path), so the backend must receive /v1/reports…,
    # not /reports…. (Was /$1, which stripped /v1 and produced 404s.)
    nginx.ingress.kubernetes.io/rewrite-target: /v1/$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  # Was the kubernetes.io/ingress.class annotation, which is deprecated and warns on apply.
  ingressClassName: nginx
  rules:
    - host: rpd311.local
      http:
        paths:
          # reports-service — submit and manage reports
          - path: /v1/(reports.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: reports-service
                port:
                  name: http
          # status-service — public read endpoints
          - path: /v1/(status.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: status-service
                port:
                  name: http
          - path: /v1/(feed.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: status-service
                port:
                  name: http
          - path: /v1/(stats.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: status-service
                port:
                  name: http
