name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- reports-service (Node.js 20) ---
  reports-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reports-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/reports-service/package-lock.json
      - run: npm ci
      - run: npm test

  # --- triage-service (Python 3.12) ---
  triage-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/triage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/triage-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # --- status-service (Go 1.22) — gofmt + vet double as lint ---
  status-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/status-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/status-service/go.sum
      - name: gofmt (fail on unformatted files)
        run: |
          unformatted="$(gofmt -l src)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./src/...
      - run: go test ./src/...
      - run: go build -o /tmp/status-service ./src/...

  # --- Build all three images to validate the Dockerfiles (build-only; never pushed).
  #     Local runs load these into minikube with `minikube image load` — see README. ---
  docker-build:
    needs: [reports-service, triage-service, status-service]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [reports-service, triage-service, status-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: rpd311/${{ matrix.service }}:ci-${{ github.sha }}
          # Per-service scope: keeps the three matrix legs from overwriting one shared
          # cache, and matches docker-compose.ci.yml so this job warms the integration
          # job's compose build cache.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # --- Cross-service integration tests: bring the whole stack up, drive the real
  #     reports→triage→status flow, assert the seams (e2e/test_flow.py) ---
  integration:
    needs: [reports-service, triage-service, status-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      # Buildx + the Actions runtime token so the compose build can read/write the
      # type=gha layer cache defined in docker-compose.ci.yml.
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: Start the full stack
        env:
          COMPOSE_BAKE: "true" # delegate compose builds to buildx bake so cache_to is honored
        run: >
          docker compose
          -f docker-compose.yml
          -f docker-compose.local.yml
          -f docker-compose.ci.yml
          up -d --build

      - name: Run integration tests
        working-directory: e2e
        env:
          E2E_HEALTH_TIMEOUT: "120" # first boot builds schema + provisions the S3 bucket
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v
