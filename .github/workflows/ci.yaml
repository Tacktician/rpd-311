name: CI

# Pipeline shape:
#
#   unit tests ──┬── docker-build ─────┐
#                ├── integration ──────┤
#                └── minikube-e2e ─────┴── deploy-prod (push to main only)
#
# deploy-prod is gated on the full minikube E2E suite passing. minikube is the
# rehearsal environment and EKS is the destination; they run the same images, the same
# manifests, and the same in-cluster datastores, so a green minikube run is meaningful
# evidence that the EKS rollout will behave. If the local cluster is broken, nothing
# reaches AWS.
#
# The deploy job self-skips until AWS_ROLE_ARN and TF_STATE_BUCKET are set as repo
# variables, so CI is green out of the box with no cloud credentials configured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- reports-service (Node.js 20) ---
  reports-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reports-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/reports-service/package-lock.json
      - run: npm ci
      - run: npm test

  # --- triage-service (Python 3.12) ---
  triage-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/triage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/triage-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # --- status-service (Go 1.22) — gofmt + vet double as lint ---
  status-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/status-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/status-service/go.sum
      - name: gofmt (fail on unformatted files)
        run: |
          unformatted="$(gofmt -l src)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./src/...
      - run: go test ./src/...
      - run: go build -o /tmp/status-service ./src/...

  # --- Build all three images to validate the Dockerfiles (build-only; never pushed).
  #     Local runs load these into minikube with `minikube image load` — see README.
  #     deploy-prod rebuilds them for ECR rather than reusing this cache; see the note
  #     on its build step. ---
  docker-build:
    needs: [reports-service, triage-service, status-service]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [reports-service, triage-service, status-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: rpd311/${{ matrix.service }}:ci-${{ github.sha }}
          # Scope the cache per service, otherwise the three matrix legs share one
          # gha cache scope and overwrite each other's layers every run.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # --- Cross-service integration tests: bring the whole stack up, drive the real
  #     reports→triage→status flow, assert the seams (e2e/test_flow.py) ---
  integration:
    needs: [reports-service, triage-service, status-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Start the full stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

      - name: Run integration tests
        working-directory: e2e
        env:
          E2E_HEALTH_TIMEOUT: "120" # first boot builds schema + provisions the S3 bucket
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  # --- The prod gate: the same manifests, on a real Kubernetes cluster.
  #     docker-compose proves the services talk to each other; this proves the
  #     Deployments, Services, Secret, cluster DNS, probes, and ingress rules are
  #     right — the things compose cannot exercise and that EKS depends on. ---
  minikube-e2e:
    needs: [reports-service, triage-service, status-service]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NAMESPACE: rpd311
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      # minikube and kubectl ship on the GitHub-hosted Ubuntu images; install only if
      # a future runner image drops them.
      - name: Ensure minikube is installed
        run: |
          command -v minikube >/dev/null || {
            curl -fsSLo /tmp/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            sudo install /tmp/minikube /usr/local/bin/minikube
          }
          minikube version

      - name: Start minikube
        run: |
          # --cpus=max rather than a fixed count: GitHub-hosted runners come in 2- and
          # 4-core flavours, and minikube hard-fails if asked for more CPUs than exist.
          # The stack needs ~1.7 CPU of requests once minikube's own control plane pods
          # are counted, so a 2-core runner is the tight case.
          #
          # metrics-server backs the reports-service HPA — same reason the EKS stack
          # installs the metrics-server addon (infra/terraform/eks.tf).
          minikube start \
            --driver=docker \
            --cpus=max \
            --memory=5000mb \
            --addons=ingress,metrics-server
          kubectl get nodes -o wide
          kubectl describe node | grep -A6 'Allocated resources' || true

      - name: Build service images into the cluster's docker daemon
        run: |
          # Building inside minikube's daemon is what `minikube image load` achieves
          # locally, without the export/import round trip. The deployments pin
          # rpd311/<svc>:1.0.0 with imagePullPolicy: IfNotPresent, so these are the
          # images the pods will run.
          eval "$(minikube docker-env)"
          for svc in reports-service triage-service status-service; do
            echo "::group::build $svc"
            docker build -t "rpd311/${svc}:1.0.0" "services/${svc}"
            echo "::endgroup::"
          done

      - name: Wait for the ingress controller
        run: |
          # Applying an Ingress before the admission webhook is serving fails the apply.
          kubectl -n ingress-nginx wait --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=240s

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap-common.yaml
          kubectl apply -f k8s/base/secret-local.yaml
          kubectl apply -f k8s/dev/datastores.yaml
          # Datastores first — the services crash-loop on a missing Postgres, and the
          # migration advisory lock needs a live server to contend on.
          kubectl -n "$NAMESPACE" rollout status deployment/postgres   --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/redis      --timeout=120s
          kubectl -n "$NAMESPACE" rollout status deployment/localstack --timeout=240s
          kubectl apply -f k8s/reports-service/
          kubectl apply -f k8s/triage-service/
          kubectl apply -f k8s/status-service/
          kubectl apply -f k8s/ingress/ingress-local.yaml

      - name: Wait for service rollouts
        run: |
          for svc in reports-service triage-service status-service; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$svc" --timeout=240s
          done
          kubectl -n "$NAMESPACE" get pods -o wide

      - name: Port-forward the three services
        run: |
          # Ports match the e2e harness defaults (flows.py: localhost:3001/3002/3003),
          # so no URL overrides are needed. Forwarding to the Services — not the pods —
          # keeps kube-proxy and the Service selectors in the path.
          #
          # nohup + redirected output is load-bearing: a background process still
          # holding the step's stdout open keeps the step from ever completing.
          nohup kubectl -n "$NAMESPACE" port-forward svc/reports-service 3001:80 >/tmp/pf-reports.log 2>&1 &
          nohup kubectl -n "$NAMESPACE" port-forward svc/triage-service  3002:80 >/tmp/pf-triage.log  2>&1 &
          nohup kubectl -n "$NAMESPACE" port-forward svc/status-service  3003:80 >/tmp/pf-status.log  2>&1 &
          for port in 3001 3002 3003; do
            ok=""
            for _ in $(seq 1 30); do
              curl -fsS "http://localhost:${port}/v1/health" >/dev/null 2>&1 && { ok=yes; break; }
              sleep 2
            done
            [ -n "$ok" ] || { echo "port-forward on ${port} never became reachable"; cat /tmp/pf-*.log; exit 1; }
          done

      - name: Run E2E suite against the cluster
        working-directory: e2e
        env:
          E2E_HEALTH_TIMEOUT: "120"
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Verify ingress routing
        run: |
          IP="$(minikube ip)"
          # Public read path is routed and keeps its /v1 prefix.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rpd311.local' "http://${IP}/v1/feed")"
          echo "GET /v1/feed via ingress -> ${code}"
          [ "$code" = "200" ] || { echo "expected 200 from /v1/feed through the ingress"; exit 1; }

          # Public write path is routed.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rpd311.local' "http://${IP}/v1/reports")"
          echo "GET /v1/reports via ingress -> ${code}"
          [ "$code" = "200" ] || { echo "expected 200 from /v1/reports through the ingress"; exit 1; }

          # triage-service must NOT be routable — this is load-bearing for Lessons 6–7.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: rpd311.local' "http://${IP}/v1/triage")"
          echo "GET /v1/triage via ingress -> ${code} (404 expected — no public rule)"
          [ "$code" = "404" ] || { echo "triage-service is reachable through the ingress; it must not be"; exit 1; }

      - name: Report HPA state
        if: always()
        run: kubectl -n "$NAMESPACE" get hpa || true

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          for svc in reports-service triage-service status-service postgres redis localstack; do
            echo "::group::logs $svc"
            kubectl -n "$NAMESPACE" logs "deployment/$svc" --tail=100 --all-containers || true
            echo "::endgroup::"
          done

  # --- Prod deploy: EKS. Only on a merge to main, only after the minikube gate,
  #     the compose integration suite, and the Dockerfile builds are all green. ---
  deploy-prod:
    needs: [docker-build, integration, minikube-e2e]
    if: >-
      ${{ github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && vars.AWS_ROLE_ARN != ''
          && vars.TF_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    environment: production
    # Never let two deploys race the same cluster or the same terraform state.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # A cold apply after a teardown builds a control plane and node group from
    # nothing, which takes 15–20 minutes.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # AWS OIDC
    env:
      NAMESPACE: rpd311
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Pinned: the AWS variant of the manifest provisions the NLB that fronts the
      # cluster. Bump deliberately — the teardown workflow deletes this controller's
      # Service by name to release the load balancer.
      INGRESS_NGINX_VERSION: controller-v1.11.3
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # `apply` rather than a create-if-missing check: it is idempotent, and it means
      # a torn-down cluster is rebuilt by the next merge to main with no manual step.
      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${AWS_REGION}"
          terraform plan -input=false -var "region=${AWS_REGION}" -out=tfplan
          terraform apply -input=false -auto-approve tfplan

      - name: Read terraform outputs
        id: tf
        working-directory: infra/terraform
        run: |
          {
            echo "cluster_name=$(terraform output -raw cluster_name)"
            echo "ecr_registry=$(terraform output -raw ecr_registry)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.tf.outputs.ecr_registry }}
        run: |
          for svc in reports-service triage-service status-service; do
            repo="${REGISTRY}/rpd311/${svc}"
            # ECR repositories are configured image_tag_mutability = IMMUTABLE, so a
            # re-run for an already-deployed commit must not attempt the push again.
            if aws ecr describe-images \
                 --repository-name "rpd311/${svc}" \
                 --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "${repo}:${GITHUB_SHA} already present — skipping build."
              continue
            fi
            echo "::group::build+push $svc"
            # No --cache-from type=gha here: the GitHub Actions cache backend needs
            # ACTIONS_RUNTIME_TOKEN, which docker/build-push-action injects but a plain
            # `run:` step does not have. Three small images build in ~2 minutes; not
            # worth a second action just to import the docker-build job's layers.
            docker buildx build \
              --tag "${repo}:${GITHUB_SHA}" \
              --push \
              "services/${svc}"
            echo "::endgroup::"
          done

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf.outputs.cluster_name }}" \
            --region "${AWS_REGION}"
          kubectl get nodes -o wide

      - name: Install ingress-nginx
        run: |
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes/ingress-nginx/${INGRESS_NGINX_VERSION}/deploy/static/provider/aws/deploy.yaml"
          kubectl -n ingress-nginx wait --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=300s

      - name: Apply base manifests
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap-common.yaml
          # NOT secret-local.yaml — that ships a committed placeholder token. Prod
          # builds the Secret from repository secrets instead.
          ./k8s/prod/create-secret.sh

      - name: Apply datastores
        run: |
          kubectl apply -f k8s/dev/datastores.yaml
          kubectl -n "$NAMESPACE" rollout status deployment/postgres   --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/redis      --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/localstack --timeout=300s

      - name: Apply services and ingress
        run: |
          kubectl apply -f k8s/reports-service/
          kubectl apply -f k8s/triage-service/
          kubectl apply -f k8s/status-service/
          kubectl apply -f k8s/prod/ingress-prod.yaml

      - name: Roll out the images built for this commit
        env:
          REGISTRY: ${{ steps.tf.outputs.ecr_registry }}
        run: |
          for svc in reports-service triage-service status-service; do
            kubectl -n "$NAMESPACE" set image "deployment/$svc" \
              "$svc=${REGISTRY}/rpd311/${svc}:${GITHUB_SHA}"
          done
          for svc in reports-service triage-service status-service; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$svc" --timeout=300s
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run E2E suite against prod
        env:
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          E2E_HEALTH_TIMEOUT: "180"
        run: |
          # nohup + redirected output — a background process holding the step's stdout
          # open would keep the step from ever completing.
          nohup kubectl -n "$NAMESPACE" port-forward svc/reports-service 3001:80 >/tmp/pf-reports.log 2>&1 &
          nohup kubectl -n "$NAMESPACE" port-forward svc/triage-service  3002:80 >/tmp/pf-triage.log  2>&1 &
          nohup kubectl -n "$NAMESPACE" port-forward svc/status-service  3003:80 >/tmp/pf-status.log  2>&1 &
          for port in 3001 3002 3003; do
            ok=""
            for _ in $(seq 1 45); do
              curl -fsS "http://localhost:${port}/v1/health" >/dev/null 2>&1 && { ok=yes; break; }
              sleep 2
            done
            [ -n "$ok" ] || { echo "port-forward on ${port} never became reachable"; cat /tmp/pf-*.log; exit 1; }
          done
          pip install -r e2e/requirements.txt
          cd e2e && pytest -q

      - name: Summarise the deployment
        if: always()
        run: |
          lb="$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
                  -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
          {
            echo "### RPD 311 — prod deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Cluster | \`${{ steps.tf.outputs.cluster_name }}\` (${AWS_REGION}) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Public endpoint | ${lb:-_load balancer still provisioning_} |"
            echo
            echo "Public read: \`curl http://${lb:-<pending>}/v1/feed\`"
            echo
            echo "Costs accrue until torn down — run the **Teardown (prod)** workflow when finished."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
          for svc in reports-service triage-service status-service; do
            echo "::group::logs $svc"
            kubectl -n "$NAMESPACE" logs "deployment/$svc" --tail=100 --all-containers || true
            echo "::endgroup::"
          done
